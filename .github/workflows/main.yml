name: Deploy Kreaterevo Frontend

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to server
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_KEY }}
          script: |
            cd /home/kreaterevo
            git pull origin main
            npm install
            npm run build
            pm2 restart kreaterevo || pm2 serve dist 3005 --name kreaterevo --spa
            pm2 save
